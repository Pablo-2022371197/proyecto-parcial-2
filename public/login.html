<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — UTEQGram</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="/src/css/material.indigo-pink.min.css">
  <link rel="stylesheet" href="/src/css/app.css">
  <link rel="icon" href="/src/images/icons/app-icon-192x192.png">
  <meta name="theme-color" content="#3f51b5">
</head>
<body>
  <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
    <header class="mdl-layout__header">
      <div class="mdl-layout__header-row">
        <span class="mdl-layout-title">UTEQGram</span>
      </div>
    </header>
    <main class="mdl-layout__content">
      <div class="login-wrap">
        <div class="mdl-card mdl-shadow--2dp">
          <div class="mdl-card__title mdl-color--primary mdl-color-text--white">
            <h2 class="mdl-card__title-text">Iniciar sesión</h2>
          </div>
          <form id="login-form">
            <div class="mdl-card__supporting-text">
              <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label" style="width:100%">
                <input class="mdl-textfield__input" type="text" id="username" name="username" autocomplete="username" required>
                <label class="mdl-textfield__label" for="username">Usuario</label>
              </div>
              <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label" style="width:100%">
                <input class="mdl-textfield__input" type="password" id="password" name="password" autocomplete="current-password" required>
                <label class="mdl-textfield__label" for="password">Contraseña</label>
              </div>
            </div>
            <p id="login-error" class="login-error" role="alert"></p>
            <div class="mdl-card__actions mdl-card--border">
              <button id="login-btn" type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">
                Entrar
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="/src/js/material.min.js"></script>
  <script src="/src/js/api.js"></script>
  <script src="/src/js/login.js"></script>
</body>
</html>
