<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios — UTEQGram</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="/src/css/material.indigo-pink.min.css">
  <link rel="stylesheet" href="/src/css/app.css">
  <link rel="icon" href="/src/images/icons/app-icon-192x192.png">
  <meta name="theme-color" content="#3f51b5">
</head>
<body>
  <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
    <header class="mdl-layout__header">
      <div class="mdl-layout__header-row">
        <span class="mdl-layout-title">UTEQGram · Admin</span>
        <div class="mdl-layout-spacer"></div>
        <nav class="mdl-navigation mdl-layout--large-screen-only">
          <a class="mdl-navigation__link" href="/">Feed</a>
          <a class="mdl-navigation__link" href="/admin/users">Usuarios</a>
        </nav>
        <span class="nav-user" id="nav-username"></span>
        <button id="logout-btn" type="button" class="mdl-button mdl-js-button mdl-button--raised">Salir</button>
      </div>
    </header>
    <div class="mdl-layout__drawer">
      <span class="mdl-layout-title">UTEQGram</span>
      <nav class="mdl-navigation">
        <a class="mdl-navigation__link" href="/">Feed</a>
        <a class="mdl-navigation__link" href="/admin/users">Usuarios</a>
      </nav>
    </div>
    <main class="mdl-layout__content">
      <div class="admin-wrap">
        <h5 class="mdl-color-text--primary">CRUD de usuarios</h5>
        <p id="admin-error" class="login-error" role="alert"></p>
        <form id="user-form" class="admin-form">
          <input type="hidden" id="user-id">
          <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
            <input class="mdl-textfield__input" type="text" id="user-username" name="username" required>
            <label class="mdl-textfield__label" for="user-username">Usuario</label>
          </div>
          <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
            <input class="mdl-textfield__input" type="password" id="user-password" name="password">
            <label class="mdl-textfield__label" for="user-password">Contraseña</label>
          </div>
          <div>
            <label for="user-role">Rol</label>
            <select id="user-role" name="role" class="mdl-textfield__input">
              <option value="user">user</option>
              <option value="admin">admin</option>
            </select>
          </div>
          <div>
            <button id="save-user-btn" type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">
              Guardar
            </button>
            <button id="reset-form-btn" type="button" class="mdl-button mdl-js-button">Cancelar</button>
          </div>
        </form>
        <table class="users-table" id="users-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Creado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="/src/js/material.min.js"></script>
  <script src="/src/js/api.js"></script>
  <script src="/src/js/nav.js"></script>
  <script src="/src/js/admin.js"></script>
</body>
</html>
