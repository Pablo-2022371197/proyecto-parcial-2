name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  notify:
    name: Registrar ejecución en OpenObserve
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enviar resultado de pruebas
        env:
          OO_URL: ${{ secrets.OO_URL }}
          OO_USER: ${{ secrets.OO_USER }}
          OO_PASSWORD: ${{ secrets.OO_PASSWORD }}
          EVENT: ci_test
          STATUS: ${{ needs.test.result }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/notify-openobserve.mjs

  deploy:
    name: Desplegar en EC2
    needs: test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH y actualizar contenedores
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/uteqgram
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Registrar despliegue en OpenObserve
        env:
          OO_URL: ${{ secrets.OO_URL }}
          OO_USER: ${{ secrets.OO_USER }}
          OO_PASSWORD: ${{ secrets.OO_PASSWORD }}
          EVENT: deploy
          STATUS: success
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          OO_STREAM: deploy
        run: node scripts/notify-openobserve.mjs
